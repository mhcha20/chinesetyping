<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>速成打字班</title>
<style>
:root{
  --bg:#fff8ee; --card:#fff; --ink:#2b2b3a; --muted:#6f6f85; --line:#f0e3cf;
  --pri:#ff6b6b; --pri2:#ffa94d; --ok:#2fbf71; --bad:#e8505b;
  --g1:#ffd8a8; --g2:#b2f2bb; --g3:#a5d8ff; --g4:#eebefa; --gx:#dee2e6;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#1c1b26;--card:#262535;--ink:#f3f1fa;--muted:#a6a3bd;--line:#3a384f;
        --g1:#7a5320;--g2:#2c6a38;--g3:#25557f;--g4:#6b3c78;--gx:#44435a}
}
*{box-sizing:border-box}
body{margin:0;font-family:"PingFang HK","Microsoft JhengHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}
header{background:linear-gradient(120deg,var(--pri),var(--pri2));color:#fff;padding:26px 16px 24px;text-align:center}
header h1{margin:0;font-size:clamp(1.6rem,5vw,2.4rem)}
header p{margin:6px 0 0}
.stats{max-width:960px;margin:-16px auto 0;padding:0 16px}
.statbox{background:var(--card);border-radius:16px;padding:12px 16px;box-shadow:0 6px 20px #0002;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.bar{flex:1;min-width:140px;height:12px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ok),#7be0a6);transition:width .5s}
.pill{font-weight:700;white-space:nowrap}
main{max-width:960px;margin:16px auto 60px;padding:0 16px}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
nav button{border:2px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:99px;cursor:pointer;font:inherit}
nav button.on{border-color:var(--pri);background:var(--pri);color:#fff}
nav button.done::after{content:" ✅"}
.card{background:var(--card);border-radius:18px;padding:20px;box-shadow:0 4px 14px #0001;margin-bottom:16px}
.card h2{margin:0 0 6px}
.tip{background:#fff3bf;color:#5c4a00;border-radius:12px;padding:10px 14px;margin:12px 0}
code{background:var(--line);padding:1px 6px;border-radius:6px}
.btn{border:0;background:var(--pri);color:#fff;padding:10px 18px;border-radius:12px;font:inherit;font-weight:700;cursor:pointer}
.btn.alt{background:var(--muted)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
/* keyboard */
.kb{display:flex;flex-direction:column;gap:6px;align-items:center;margin:14px 0;user-select:none}
.kr{display:flex;gap:6px}
.kr:nth-child(2){margin-left:18px}.kr:nth-child(3){margin-left:46px}
.key{width:clamp(30px,8.4vw,58px);height:clamp(40px,10.5vw,64px);border-radius:10px;border:2px solid #0002;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);transition:transform .08s}
.key b{font-size:clamp(.65rem,2vw,.8rem);opacity:.7;line-height:1}
.key span{font-size:clamp(1rem,3.4vw,1.5rem);line-height:1.2}
.key.g1{background:var(--g1)}.key.g2{background:var(--g2)}.key.g3{background:var(--g3)}.key.g4{background:var(--g4)}.key.gx{background:var(--gx)}
.key.hit{transform:scale(1.15);outline:3px solid var(--pri)}
.key.target{outline:3px dashed var(--ok);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.1)}}
.legend{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;font-size:.85rem}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:middle;margin-right:4px}
/* drill */
.stage{text-align:center;padding:10px}
.big{font-size:clamp(4rem,18vw,7rem);line-height:1.1;font-weight:700}
.sub{min-height:1.8em;color:var(--muted);font-size:1.1rem}
.buf{display:flex;gap:8px;justify-content:center;min-height:56px;margin:8px 0}
.buf span{min-width:48px;height:52px;border-radius:12px;background:var(--line);display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:700}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.prog{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;width:0;background:var(--pri);transition:width .2s}
.msg{font-weight:700}.ok{color:var(--ok)}.bad{color:var(--bad)}
.demo{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.demo button{font-size:1.6rem;padding:6px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.demo button.on{border-color:var(--pri)}
table{border-collapse:collapse;margin:8px auto}
td,th{border:1px solid var(--line);padding:4px 10px;text-align:center}
canvas{position:fixed;inset:0;pointer-events:none;z-index:99}
footer{text-align:center;color:var(--muted);padding:20px;font-size:.9rem}
</style>
</head>

<header>

  <p>由零開始學倉頡／速成輸入法，邊玩邊練，打字快過手寫！</p>

let drill=null;
function startDrill(box,o){
  // o: items[], expect(item)->code, prompt(item)->html, sub(item)->html, goal, seconds?, onDone(stat), showAfter?
  const st={i:0,ok:0,miss:0,buf:"",items:o.items,t0:null,over:false};
  box.innerHTML=`<div class="stage"><div class="prog"><i id="dp"></i></div>
    <div class="big" id="dq"></div><div class="sub" id="ds"></div>
    <div class="buf" id="db"></div><div class="msg" id="dm"></div></div>`;
  const dq=$("#dq"),ds=$("#ds"),db=$("#db"),dm=$("#dm"),dp=$("#dp");
  let timer=null;
  const cur=()=>st.items[st.i%st.items.length];
  function show(){
    const it=cur();dq.innerHTML=o.prompt(it);ds.innerHTML=o.sub?o.sub(it):"";
    st.buf="";draw();target(o.assist?o.expect(it)[st.buf.length]:"");
    dp.style.width=(o.seconds?0:st.ok/o.goal*100)+"%";
  }
  function draw(){const n=o.expect(cur()).length;
    db.innerHTML="";for(let k=0;k<n;k++){const s=document.createElement("span");
      s.textContent=st.buf[k]?(RAD[st.buf[k]]||st.buf[k])+" "+st.buf[k]:"";db.appendChild(s)}}
  function finish(){
    st.over=true;clearInterval(timer);drill=null;target("");
    o.onDone(st);
  }
  function key(k){
    if(st.over)return;
    if(k==="BACK"){st.buf=st.buf.slice(0,-1);draw();return}
    if(!/^[A-Z]$/.test(k))return;
    if(!st.t0){st.t0=Date.now();
      if(o.seconds){const end=st.t0+o.seconds*1000;
        timer=setInterval(()=>{const left=Math.max(0,Math.ceil((end-Date.now())/1000));
          dp.style.width=(100-left/o.seconds*100)+"%";ds.dataset.left=left;
          const tl=$("#tleft");if(tl)tl.textContent=left;
          if(left<=0)finish()},200)}}
    flash(k);const it=cur(),exp=o.expect(it);
    if(st.buf.length>=exp.length)return;
    st.buf+=k;draw();
    if(!o.assist||true){/* 輔助提示 */}
    if(st.buf.length===exp.length){
      if(st.buf===exp){
        st.ok++;gain(o.xp||3);dm.className="msg ok";
        dm.textContent="✔ "+(o.after?o.after(it):"啱！");
        st.i++;
        if(!o.seconds&&st.ok>=o.goal){finish();return}
        setTimeout(()=>{if(!st.over)show()},o.seconds?120:450);
      }else{
        st.miss++;dm.className="msg bad";
        dm.textContent="✘ 正確係 "+[...exp].map(c=>(RAD[c]||"")+c).join(" ");
        db.classList.remove("shake");void db.offsetWidth;db.classList.add("shake");
        setTimeout(()=>{if(!st.over){st.buf="";draw();target(o.assist?exp[0]:"")}},700);
      }
    }else if(o.assist)target(exp[st.buf.length]);
  }
  drill={key};show();
  return st;
}
addEventListener("keydown",e=>{
  if(!drill||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==="Backspace"){drill.key("BACK");e.preventDefault();return}
  if(/^[a-zA-Z]$/.test(e.key)){drill.key(e.key.toUpperCase());e.preventDefault()}
});
document.addEventListener("click",e=>{const k=e.target.closest(".key");

  <p>倉頡拆字，順序係<b>由上到下、由左到右、由外到內</b>。例如：</p>
  <table><tr><th>字</th><th>拆法</th><th>倉頡碼</th></tr>
  <tr><td>明</td><td>日＋月</td><td>AB</td></tr><tr><td>林</td><td>木＋木</td><td>DD</td></tr>
  <tr><td>好</td><td>女＋子(弓＋木)</td><td>VND</td></tr></table>
  <p>字旁會提示字根，你要打出完整倉頡碼。打啱 8 個字過關！</p></div>
  <div class="card"><div id="kbbox"></div><div id="dbox"></div></div>`;
  $("#kbbox").appendChild(keyboard());
  const items=shuffle(EASY);
  startDrill($("#dbox"),{items,goal:8,xp:5,assist:true,
    expect:c=>CHARS[c],prompt:c=>c,sub:c=>`字根提示：${rads(CHARS[c])}`,
    after:c=>`${c} = ${CHARS[c].split("").join(" ")}`,
    onDone:st=>finishLesson(2,st,"拆字高手！")});
 }},
{emoji:"⚡",title:"速成：取頭尾",
 render(box){

{emoji:"🏁",title:"打字挑戰",
 render(box){
  box.innerHTML=`<div class="card"><h2>🏁 第 5 課：60 秒挑戰</h2>
  <p>用速成（頭尾 2 碼）盡量打多啲字，無提示！答啱 12 個或以上畢業。</p>
  <p>最佳成績：<b id="best">${S.best}</b> 字　⏱ 剩 <b id="tleft">60</b> 秒</p>
  <div class="row"><button class="btn" id="go">▶ 開始挑戰</button></div></div>
  <div class="card"><div id="kbbox"></div><div id="dbox"><div class="stage sub">撳「開始挑戰」，然後打第一個字就開始計時</div></div></div>`;
  $("#kbbox").appendChild(keyboard());
  $("#go").onclick=()=>{
    const items=shuffle(EASY);
    startDrill($("#dbox"),{items:[...items,...shuffle(items),...shuffle(items)],seconds:60,xp:3,
      expect:c=>quick(CHARS[c]),prompt:c=>c,sub:c=>"",
      onDone:st=>{
        const n=st.ok;if(n>S.best){S.best=n;save()}
        $("#best").textContent=S.best;
        $("#dbox").innerHTML=`<div class="stage"><div class="big">${n} 字</div>
          <div class="sub">每分鐘 ${n} 字，打錯 ${st.miss} 次</div>
          <div class="msg ${n>=12?"ok":"bad"}">${n>=12?"🎓 畢業！你已經識用速成打字喇！":"再練多次，目標 12 字！"}</div></div>`;
        if(n>=12&&!S.done[4]){S.done[4]=1;gain(50);nav()}
        if(n>=12)boom(220);else boom(40);
      }});
  };
 }},
{emoji:"📚",title:"1200 字庫",
 render(box){
  box.innerHTML=`<div class="card"><h2>📚 第 6 課：1200 常用字庫</h2>
  <p>呢度有 <b>1200 個常用字</b>，按使用頻率排序。先查字，再揀範圍特訓。</p>
  <div class="row"><input id="q" maxlength="6" placeholder="輸入想查嘅字，例如：香港" style="font:inherit;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)"></div>
  <div id="qr" class="sub" style="margin-top:8px"></div></div>
  <div class="card"><h2>🎯 範圍特訓</h2>
  <p>揀字庫範圍，用<b>速成（頭尾 2 碼）</b>打，連續答啱 25 個過關。</p>
  <div class="row" id="rng"></div>
  <div id="kbbox"></div><div id="dbox"><div class="stage sub">揀一個範圍開始</div></div></div>`;
  $("#kbbox").appendChild(keyboard());
  $("#q").oninput=e=>{
    const t=[...e.target.value];
    $("#qr").innerHTML=t.length?t.map(c=>{const k=CHARS[c];
      return k?`<b>${c}</b>　倉頡 ${[...k].join(" ")}（${rads(k)}）　速成 <b>${quick(k)}</b>`
      :`<b>${c}</b>　不在 1200 字庫內`}).join("<br>"):"";
  };
  const ranges=[["1–200 入門",0,200],["201–500",200,500],["501–800",500,800],["801–1200",800,1200],["全部 1200",0,1200]];
  ranges.forEach(([label,a,b])=>{const e=document.createElement("button");e.className="btn alt";e.textContent=label;
    e.onclick=()=>startDrill($("#dbox"),{items:shuffle(POOL.slice(a,b)),goal:25,xp:3,assist:false,
      expect:c=>quick(CHARS[c]),prompt:c=>c,
      sub:c=>`倉頡：${[...CHARS[c]].join(" ")}　→　取頭尾`,
      after:c=>`${c}：${CHARS[c]} → ${quick(CHARS[c])}`,
      onDone:st=>finishLesson(5,st,"字庫特訓完成！")});
    $("#rng").appendChild(e)});
 }}
];

function finishLesson(i,st,txt){
  if(!S.done[i]){S.done[i]=1;gain(30);nav()}
  boom();
  const b=document.querySelector("#dbox");
  const last=i>=LESSONS.length-1;
  b.innerHTML=`<div class="stage"><div class="big">🎉</div>
   <div class="msg ok">${txt} 答啱 ${st.ok}，打錯 ${st.miss}。+30 XP</div>
   <div class="row" style="justify-content:center"><button class="btn alt" id="again">再練一次</button>
   ${last?"":'<button class="btn" id="nx">下一課 →</button>'}</div></div>`;
  $("#again").onclick=()=>go(i);
  const nx=$("#nx");if(nx)nx.onclick=()=>go(i+1);
}

function nav(){
  const n=$("#nav");n.innerHTML="";
  LESSONS.forEach((l,i)=>{const b=document.createElement("button");
    b.textContent=`${l.emoji} ${i+1}. ${l.title}`;
    b.className=(i===S.cur?"on ":"")+(S.done[i]?"done":"");
    b.onclick=()=>go(i);n.appendChild(b)});
}
function go(i){drill=null;S.cur=i;save();nav();stats();
  const box=$("#lesson");box.innerHTML="";LESSONS[i].render(box);scrollTo(0,0)}

/* 彩帶 */
const cv=$("#fx"),cx=cv.getContext("2d");let ps=[];
function boom(n=80){cv.width=innerWidth;cv.height=innerHeight;
  for(let k=0;k<n;k++)ps.push({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*14,vy:Math.random()*-12-2,c:`hsl(${Math.random()*360},90%,60%)`,l:90});
  if(ps.length===n)loop()}
function loop(){cx.clearRect(0,0,cv.width,cv.height);ps=ps.filter(p=>p.l>0);
  ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.4;p.l--;cx.fillStyle=p.c;cx.fillRect(p.x,p.y,7,7)});
  if(ps.length)requestAnimationFrame(loop)}
go(S.cur);
</script>
</body>
